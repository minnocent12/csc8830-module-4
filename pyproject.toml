[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "module4"
version = "0.1.0"
description = "CSc 8830 Module 4 - classical RGB and thermal human boundary detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "Pillow>=10.0",
    "streamlit>=1.49,<2",
]

[project.optional-dependencies]
# The web app tests drive uploads through AppTest.file_uploader, first shipped in Streamlit 1.56.
dev = ["pytest>=8.0", "streamlit>=1.56,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
